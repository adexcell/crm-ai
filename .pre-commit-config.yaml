repos:
  # ==========================================
  # 1. Общие проверки репозитория
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
        exclude: '(^|/)tsconfig.*\.json$'
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # ==========================================
  # 2. Python Backend (Ruff)
  # ==========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend-python/
      - id: ruff-format
        files: ^backend-python/

  # ==========================================
  # 3. Go Backend (go fmt, go vet)
  # ==========================================
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd backend-go && go fmt ./...'
        language: system
        pass_filenames: false
        files: ^backend-go/.*\.go$
      - id: go-vet
        name: go vet
        entry: bash -c 'cd backend-go && go vet ./...'
        language: system
        pass_filenames: false
        files: ^backend-go/.*\.go$

  # ==========================================
  # 4. Frontend (Prettier для Vue 3, TS, CSS)
  # ==========================================
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v4.0.0-alpha.8
  #   hooks:
  #     - id: prettier
  #       files: ^frontend/.*\.(vue|ts|js|json|css|scss|md)$
