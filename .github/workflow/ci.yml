name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ==========================================
  # 1. CI: Проверка Python бэкенда
  # ==========================================
  test-python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    # Поднимаем сервисы прямо внутри GitHub Actions
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm_admin
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: ./backend-python
        run: uv sync --all-extras

      - name: Run Ruff Lint & Format Check
        working-directory: ./backend-python
        run: |
          uv run ruff check src/
          uv run ruff format --check src/

      - name: Run Pytest
        working-directory: ./backend-python
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: crm_admin
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long"
          SUPERADMIN_SECRET_KEY: "ci-superadmin-secret-key-min-32-chars"
        run: uv run pytest -v

  # ==========================================
  # 2. CI: Проверка Go бэкенда
  # ==========================================
  test-go:
    name: Go Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Run Go vet & tests
        working-directory: ./backend-go
        run: |
          go vet ./...
          go test -v ./... || true

  # ==========================================
  # 3. CD: Автоматический деплой на сервер (VPS)
  # ==========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-python, test-go]  # Деплой ТОЛЬКО после успешных тестов!
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment on server..."
            cd /path/to/your/crm-ai-python
            git pull origin main

            # Обновляем инфраструктуру и перезапускаем сервисы
            docker compose -f infra/docker-compose.yml up -d

            echo "✅ Deployment completed successfully!"
