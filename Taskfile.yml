version: "3"

dotenv: [".env", "backend-go/.env"]

tasks:
  default:
    desc: "Показать список всех доступных команд"
    cmds:
      - task --list

  up:
    desc: "Поднять контейнеры"
    cmds:
      - docker compose up -d

  down:
    desc: "Остановить контейнеры"
    cmds:
      - docker compose down

  logs:
    desc: "Смотреть логи баз данных в реальном времени"
    cmds:
      - docker compose logs -f

  run-go-server:
    desc: "Запустить Go бэкенд локально"
    dir: backend-go
    cmds:
      - go run cmd/server/main.go

  dev:
    desc: "Поднять базы данных и запустить Go сервер (Fast Start)"
    deps: [up]
    cmds:
      - task: run

  tidy:
    desc: "Обновить и почистить go.mod и go.sum"
    dir: backend-go
    cmds:
      - go mod tidy

  lint:
    desc: "Запустить статический анализ и аудит безопасности (golangci-lint v2)"
    dir: backend-go
    cmds:
      - golangci-lint run --config ../.golangci.yml ./...

  test:
    desc: "Запуск тестов"
    dir: backend-go
    cmds:
      - go test -v ./...

  test:race:
    desc: "Запуск тестов с детектором гонок памяти"
    dir: backend-go
    cmds:
      - go test -v -race -timeout 3m ./...

  build:
    desc: "Скомпилировать бинарник сервера для проверки сборки"
    dir: backend-go
    cmds:
      - go build -v -o /dev/null ./cmd/server/main.go
